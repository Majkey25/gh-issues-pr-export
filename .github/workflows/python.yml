name: Python

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-export:
    name: Browser export request regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --test tests/browser-export.test.mjs

  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install tools
        run: python -m pip install ".[attachments]" build pyright ruff

      - name: Ruff check
        run: ruff check .

      - name: Pyright check
        run: pyright --pythonpath "$pythonLocation/bin/python" .

      - name: Compile Python
        run: python -m compileall cleanup_img_ext.py download_attachments.py export_issues_prs.py

      - name: Python regressions
        run: python -m unittest discover -s tests -v

      - name: Build package
        run: python -m build

      - name: Upload package artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*
