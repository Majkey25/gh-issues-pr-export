# Check twice weekly in UTC, with stable times per repository, ecosystem and directory.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "6 10 * * 1,4"
      timezone: Etc/UTC
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: cron
      cronjob: "14 12 * * 1,4"
      timezone: Etc/UTC
